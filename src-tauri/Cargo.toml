[package]
name = "solo-compose"
version = "2.3.0"
description = "Music composition simplified."
authors = ["Aled Jones <aledjones.viola@gmail.com>"]
edition = "2021"
default-run = "solo-compose"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "compose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "performance"
path = "src/bin/performance.rs"

[[bin]]
name = "generate-manifest"
path = "src/bin/generate_manifest.rs"

[[bin]]
name = "solo-compose"
path = "src/main.rs"

[build-dependencies]
cc = "1.2.62"
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
axum = "0.8.9"
tauri = { version = "2.11.2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.20.0"
serde_repr = "0.1.20"
rustc-hash = "2.1.2"
skia-safe = { version = "0.97.0", features = ["metal"] }
lazy_static = "1.5.0"
rayon = "1.12.0"
roman = "0.1.6"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tauri-plugin-devtools = "2.1.0"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-store = "2.4.3"
flate2 = "1.1.9"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
base64 = "0.22.1"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-metal = "0.3.2"
semver = "1.0.28"
sled = "0.34.7"
cpal = "0.17.3"
symphonia = { version = "0.6.0", features = ["flac"] }
rubato = "2.0.0"
audioadapter-buffers = "3.0.0"
dirs = "6.0.0"
regex = "1.12.3"
rtrb = "0.3.4"
rand = "0.10.1"
blake3 = "1.8.5"
rmp-serde = "1.3.1"
libloading = "0.9.0"
vst3 = "0.3.0"
uuid = { version = "1.23.1", features = ["v4"] }
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[profile.release]
# less code to include into binary
panic = 'abort'
# optimization over all codebase ( better optimization, slower build )
codegen-units = 1
# link time optimization using whole-program analysis
lto = "fat"
# optimize for speed
opt-level = 3
# enable more aggressive optimizations
debug = false
# strip debug symbols
strip = true
# enable overflow checks in release (remove if causing issues)
overflow-checks = false
rpath = false
