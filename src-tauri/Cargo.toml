[package]
name = "solo-compose"
version = "1.23.0"
description = "Music composition simplified."
authors = ["Aled Jones <aledjones.viola@gmail.com>"]
edition = "2021"
default-run = "solo-compose"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "compose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "scvi-compress"
path = "src/bin/scvi_compress.rs"

[[bin]]
name = "scvi-inspect"
path = "src/bin/scvi_inspect.rs"

[[bin]]
name = "generate-manifest"
path = "src/bin/generate_manifest.rs"

[[bin]]
name = "solo-compose"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.10.1", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
rustc-hash = "2.1.1"
skia-safe = { version = "0.93.0", features = ["metal"] }
lazy_static = "1.5.0"
rayon = "1.10"
roman = "0.1.6"
tauri-plugin-devtools = "2.0.1"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-store = "2.4.2"
flate2 = "1.1.9"
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
base64 = "0.22.1"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-metal = "0.3.2"
semver = "1.0.27"
sled = "0.34.7"
cpal = "0.17.3"
symphonia = { version = "0.5.5", features = ["flac"] }
rubato = "1.0.1"
audioadapter-buffers = "2.0.0"
dirs = "6.0.0"
regex = "1.12.3"
rtrb = "0.3.2"
rand = "0.10.0"
blake3 = "1.8.2"
rmp-serde = "1.3.0"

[profile.release]
# less code to include into binary
panic = 'abort'
# optimization over all codebase ( better optimization, slower build )
codegen-units = 1
# link time optimization using using whole-program analysis
lto = "fat"
# optimize for speed
opt-level = 3
# enable more aggressive optimizations
debug = false
# strip debug symbols
strip = true
# enable overflow checks in release (remove if causing issues)
overflow-checks = false
# enable vectorization
rpath = false
