# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "When developing a story, ask clarifying questions if requirements, behavior, UX, architecture, constraints, priorities, or quality expectations are ambiguous or require a subjective human decision."
  - "Do not make best guesses during story implementation when a human clarification is needed to choose the correct behavior or technical direction."

# Add persistent memories for the agent
memories:
  - "Story implementation must pause for human clarification when ambiguity or subjective product and technical decisions remain."
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
