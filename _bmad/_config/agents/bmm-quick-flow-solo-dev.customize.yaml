# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "When producing a quick spec or implementation spec for this repository, require an explicit Documentation Impact section that names the docs, READMEs, architecture notes, developer guidance, and AI-agent instructions that must change, or states explicitly why no documentation updates are needed."
  - "Do not treat documentation as optional follow-up work: include concrete doc-update tasks and acceptance criteria whenever the change affects behavior, architecture, persistence, workflows, user-visible behavior, or team and agent expectations."
  - "Do not finalize a quick spec as ready-for-dev if documentation impact is missing or the required documentation follow-through is not captured."

# Add persistent memories for the agent
memories:
  - "Project specs must capture documentation impact explicitly rather than implying it."
  - "If project rules or required implementation practices change, update AI-agent instructions as part of the spec and implementation plan."
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
