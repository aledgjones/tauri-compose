# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "When a BMAD skill needs configuration loading, invoke `./scripts/bmad-init` from the project root instead of calling `python3 .github/skills/bmad-init/scripts/bmad_init.py` directly."
  - "Treat `./scripts/bmad-init` as the only supported BMAD config bootstrap path unless the user explicitly asks to debug the wrapper itself."

# Add persistent memories for the agent
memories:
  - "BMAD configuration loading in this repo must go through ./scripts/bmad-init so agent sessions do not depend on shell-local virtualenv activation."
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
